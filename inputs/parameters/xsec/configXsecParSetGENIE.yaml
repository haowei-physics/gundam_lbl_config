      - dialType: Spline
        options: catmull-rom, uniformity(1e-6)
        treeExpression: "GENIE_MvNCRES"
        applyOnDataSets: [ "HK" ]

  # NC elastic axial mass [GeV], 0.995 +- 25%
  - name: "GENIE_MaNCEL"
    isEnabled: true
    dialSetDefinitions:
      - dialType: Spline
