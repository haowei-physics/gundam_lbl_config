  # --------------------------------------------------------- normalisations

  # CCQE normalisation, sigma +0.20/-0.15 (prior sigma 0.20)
  - name: "GENIE_NormCCQE"
    isEnabled: true
    dialSetDefinitions:
      - dialType: Graph
        treeExpression: "GENIE_NormCCQE"
        applyOnDataSets: [ "HK" ]

  # CC 2p2h normalisation, sigma 0.5
